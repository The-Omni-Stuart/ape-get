name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            arch: x86_64
          - os: windows-latest
            name: windows-x64
            arch: AMD64
          - os: macos-14
            name: macos-arm64
            arch: arm64
          - os: macos-15-intel
            name: macos-x64
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Windows test tooling
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-tooling

      - name: Build and test
        run: mvn -B package

      - name: Check runner architecture
        if: runner.os != 'Windows'
        run: |
          actual="$(uname -m)"
          echo "runner=${{ matrix.name }} expected=${{ matrix.arch }} actual=$actual"
          test "$actual" = "${{ matrix.arch }}"

      - name: Check runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = $env:PROCESSOR_ARCHITECTURE
          Write-Host "runner=${{ matrix.name }} expected=${{ matrix.arch }} actual=$actual"
          if ($actual -ne '${{ matrix.arch }}') { throw "unexpected architecture: $actual" }

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          jar="$(ls target/*-jar-with-dependencies.jar)"
          smoke_home="$RUNNER_TEMP/grm-smoke-home"
          rm -rf "$smoke_home"
          mkdir -p "$smoke_home"
          run() { java -Duser.home="$smoke_home" -jar "$jar" "$@"; }

          run help > /dev/null
          run list > /dev/null

          set +e
          run install > /dev/null 2>&1
          usage_exit=$?
          set -e
          test "$usage_exit" -eq 2

          if [ "$(uname -s)" = "Darwin" ]; then
            state="$smoke_home/Library/Application Support/github-release-manager"
          else
            state="$smoke_home/.local/share/github-release-manager"
          fi
          test -f "$state/grm_config.json"
          test -f "$state/grm_index.json"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = (Get-ChildItem target/*-jar-with-dependencies.jar).FullName
          $smokeHome = Join-Path $env:RUNNER_TEMP 'grm-smoke-home'
          $localAppData = Join-Path $env:RUNNER_TEMP 'grm-smoke-localappdata'
          New-Item -ItemType Directory -Force $smokeHome, $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData
          Write-Host "jar=$jar home=$smokeHome localappdata=$localAppData"

          java "-Duser.home=$smokeHome" -jar $jar help | Out-Null
          Write-Host "help exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "help exited with $LASTEXITCODE" }

          java "-Duser.home=$smokeHome" -jar $jar list | Out-Null
          Write-Host "list exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "list exited with $LASTEXITCODE" }

          java "-Duser.home=$smokeHome" -jar $jar install 2>$null | Out-Null
          Write-Host "install exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 2) { throw "install without an argument exited with $LASTEXITCODE, expected 2" }

          $state = Join-Path $localAppData 'github-release-manager'
          Write-Host "state=$state"
          if (!(Test-Path (Join-Path $state 'grm_config.json'))) { throw "config was not created in $state" }
          if (!(Test-Path (Join-Path $state 'grm_index.json'))) { throw "index was not created in $state" }

          Write-Host "smoke test passed"
          exit 0

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.name }}
          path: target/surefire-reports/
          if-no-files-found: ignore
