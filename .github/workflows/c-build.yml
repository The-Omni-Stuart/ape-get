name: C Build & Test

# build the static x86_64 binary with cosmocc, then run every gate a
# local check runs: ctest (deps graph, free-order, provenance, help smoke)
# and the full CLI scenario suite. The companion c-fuzz.yml owns the
# parser fuzz smoke.

on:
  push:
    branches: [main, master, develop, windows_development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor provenance pins
        run: bash bin/vendor-pin-check.sh

      - name: Resolve cosmocc cache dir
        run: echo "COSMO_DIR=$HOME/.cosmocc" >> "$GITHUB_ENV"

      - name: Restore cosmocc
        id: cosmo
        uses: actions/cache@v4
        with:
          path: ~/.cosmocc
          # toolchain/PIN pins the exact release + hash; re-key on its edit.
          key: cosmocc-${{ runner.os }}-${{ hashFiles('toolchain/PIN') }}

      - name: Install cosmocc (PIN)
        if: steps.cosmo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=$(awk '/^url:/{print $2}' toolchain/PIN)
          sha=$(awk '/^sha256:/{print $2}' toolchain/PIN)
          curl -fL --retry 3 "$url" -o /tmp/cosmocc.zip
          echo "$sha  /tmp/cosmocc.zip" | sha256sum -c -
          mkdir -p "$COSMO_DIR"
          unzip -q /tmp/cosmocc.zip -d "$COSMO_DIR"
          test -x "$COSMO_DIR/bin/apelink"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/cosmo.cmake" \
            -DCOSMO_DIR="$COSMO_DIR"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Static checks + help smoke (ctest)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3   # delta round-trip helper
          ctest --test-dir build --output-on-failure

      # probe-skip fans out to the live built-ins; the runner has egress,
      # and the rate-limited 403 shape is pinned by a .flaky golden.
      - name: Scenario suite
        run: python3 src/test/scenarios/run.py --bin ./build/ape-get

      - name: Build artefact
        uses: actions/upload-artifact@v4
        with:
          name: ape-get-linux-x64
          path: build/ape-get
          if-no-files-found: error
          compression-level: 0

  package:
    name: Package APE + size gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve cosmocc cache dir
        run: echo "COSMO_DIR=$HOME/.cosmocc" >> "$GITHUB_ENV"

      - name: Restore cosmocc
        id: cosmo
        uses: actions/cache@v4
        with:
          path: ~/.cosmocc
          key: cosmocc-${{ runner.os }}-${{ hashFiles('toolchain/PIN') }}

      - name: Install cosmocc (PIN)
        if: steps.cosmo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=$(awk '/^url/{print $2}' toolchain/PIN)
          sha=$(awk '/^sha256/{print $2}' toolchain/PIN)
          curl -fL --retry 3 "$url" -o /tmp/cosmocc.zip
          echo "$sha  /tmp/cosmocc.zip" | sha256sum -c -
          mkdir -p "$COSMO_DIR"
          unzip -q /tmp/cosmocc.zip -d "$COSMO_DIR"

      # fat APE = apelink of the two per-arch ELFs; both cross-compiled
      # from linux by the bundled drivers. package.sh re-checks magic, the
      # 1.6 MB fat / 1 MB single size gates and the transport twins
      # (publish only < 95%), failing the job on drift.
      - name: Build per-arch ELFs
        run: |
          for a in x86_64 aarch64; do
            cmake -S . -B "build/$a" \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/cosmo.cmake" \
              -DCOSMO_DIR="$COSMO_DIR" -DAPEGET_ARCH="$a"
            cmake --build "build/$a" -j"$(nproc)"
          done

      - name: Package + gates
        run: bash bin/package.sh build/x86_64 build/aarch64 dist

      - name: Upload APE artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ape-get-ape
          path: |
            dist/ape-get*.com
            dist/ape-get*.com.xz
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: ape-get-ape
          path: dist

      - name: Name artefacts
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          cd dist
          for f in ape-get.com ape-get-x86_64.com ape-get-aarch64.com \
                   ape-get.com.xz ape-get-x86_64.com.xz ape-get-aarch64.com.xz; do
            [ -f "$f" ] || continue          # twins exist only when they win
            case $f in
              ape-get.com*)  mv "$f" "ape-get-${ver}-fat${f#ape-get}" ;;
              *)             mv "$f" "ape-get-${ver}-${f#ape-get-}" ;;
            esac
          done
          ls -l

      # Deltas against the last K=3 stable releases (fewest bytes always:
      # a delta ships only when it is < 95% of the twin it replaces).
      # -S none: the shipped decoder carries no secondary compressors,
      # and the encoder never reaches an artefact.
      - name: Deltas against recent stables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3
          api=https://api.github.com/repos/${{ github.repository }}
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
               "$api/releases?per_page=30" > releases.json
          mapfile -t olds < <(jq -r --arg v "$ver" \
            '[.[] | select((.prerelease | not) and (.draft | not))
                  | .tag_name | sub("^v"; "") | select(. != $v)]
             | .[0:3][]' releases.json)
          echo "deltas against: ${olds[*]:-none}"
          for kind in fat x86_64 aarch64; do
            new="dist/ape-get-${ver}-${kind}.com"
            [ -f "$new" ] || continue
            cmp="$new"
            if [ -f "$new.xz" ]; then cmp="$new.xz"; fi
            gate=$(( $(stat -c %s "$cmp") * 95 / 100 ))
            for ov in "${olds[@]}"; do
              url=$(jq -r --arg n "ape-get-${ov}-${kind}.com" \
                '[.[] | .assets[]? | select(.name == $n)
                       | .browser_download_url][0] // empty' releases.json)
              [ -n "$url" ] || continue
              curl -fsSL -o old.com "$url" || continue
              out="dist/ape-get-${ver}-${kind}.com-from-${ov}.xdelta.xz"
              xdelta3 -f -e -S none -s old.com "$new" patch.xd
              xz --lzma2=preset=9e,dict=8MiB --check=sha256 -c patch.xd > "$out"
              rm -f patch.xd
              enc=$(stat -c %s "$out")
              if [ "$enc" -lt "$gate" ]; then
                echo "\`$(basename "$out")\`: $enc bytes (vs $cmp $(stat -c %s "$cmp"))" \
                  >> "$GITHUB_STEP_SUMMARY"
              else
                rm -f "$out"
                echo "delta skipped (no win): $(basename "$out") $enc/$gate"
              fi
            done
          done
          ls -l dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ape-get-* > SHA256SUMS.txt
          ls -l

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ape-get-*.com
            dist/ape-get-*.com.xz
            dist/ape-get-*.xdelta.xz
            dist/SHA256SUMS.txt
          # tags with a suffix (2.0.0-rc) publish as prereleases, so
          # /releases/latest keeps pointing at stable
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
