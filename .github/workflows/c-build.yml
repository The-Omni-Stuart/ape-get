name: C Build & Test

# build the static x86_64 binary with cosmocc, then run every gate a
# local check runs: ctest (deps graph, free-order, provenance, help smoke)
# and the full CLI scenario suite. The companion c-fuzz.yml owns the
# parser fuzz smoke.

on:
  push:
    branches: [main, master, develop, develop-windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor provenance pins
        run: bash bin/vendor-pin-check.sh

      - name: Resolve cosmocc cache dir
        run: echo "COSMO_DIR=$HOME/.cosmocc" >> "$GITHUB_ENV"

      - name: Restore cosmocc
        id: cosmo
        uses: actions/cache@v4
        with:
          path: ~/.cosmocc
          # toolchain/PIN pins the exact release + hash; re-key on its edit.
          key: cosmocc-${{ runner.os }}-${{ hashFiles('toolchain/PIN') }}

      - name: Install cosmocc (PIN)
        if: steps.cosmo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=$(awk '/^url:/{print $2}' toolchain/PIN)
          sha=$(awk '/^sha256:/{print $2}' toolchain/PIN)
          curl -fL --retry 3 "$url" -o /tmp/cosmocc.zip
          echo "$sha  /tmp/cosmocc.zip" | sha256sum -c -
          mkdir -p "$COSMO_DIR"
          unzip -q /tmp/cosmocc.zip -d "$COSMO_DIR"
          test -x "$COSMO_DIR/bin/apelink"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/cosmo.cmake" \
            -DCOSMO_DIR="$COSMO_DIR"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Static checks + help smoke (ctest)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3   # delta round-trip helper
          ctest --test-dir build --output-on-failure

      # probe-skip fans out to the live built-ins; the runner has egress,
      # and the rate-limited 403 shape is pinned by a .flaky golden.
      - name: Scenario suite
        run: python3 src/test/scenarios/run.py --bin ./build/ape-get

      - name: Build artefact
        uses: actions/upload-artifact@v4
        with:
          name: ape-get-linux-x64
          path: build/ape-get
          if-no-files-found: error
          compression-level: 0

  package:
    name: Package APE + size gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve cosmocc cache dir
        run: echo "COSMO_DIR=$HOME/.cosmocc" >> "$GITHUB_ENV"

      - name: Restore cosmocc
        id: cosmo
        uses: actions/cache@v4
        with:
          path: ~/.cosmocc
          key: cosmocc-${{ runner.os }}-${{ hashFiles('toolchain/PIN') }}

      - name: Install cosmocc (PIN)
        if: steps.cosmo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=$(awk '/^url/{print $2}' toolchain/PIN)
          sha=$(awk '/^sha256/{print $2}' toolchain/PIN)
          curl -fL --retry 3 "$url" -o /tmp/cosmocc.zip
          echo "$sha  /tmp/cosmocc.zip" | sha256sum -c -
          mkdir -p "$COSMO_DIR"
          unzip -q /tmp/cosmocc.zip -d "$COSMO_DIR"

      # fat APE = apelink of the two per-arch ELFs; both cross-compiled
      # from linux by the bundled drivers. package.sh re-checks magic, the
      # 1,638 KiB fat / 1 MB single size gates and the transport twins
      # (publish only < 95%), failing the job on drift.
      - name: Resolve release version
        id: relver
        if: startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          # one normalised version for the whole release: the same string
          # the "Name artefacts" step derives filenames from
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build per-arch ELFs
        env:
          RELVER: ${{ steps.relver.outputs.version }}
        run: |
          set -euo pipefail
          # on a tag the version baked into BOTH arch binaries equals the
          # release filename's; branch builds keep the CMake default the
          # scenario goldens pin (dev identity stays honest: the packaged
          # binary is never what a tag publishes without the assert below)
          vargs=()
          if [ -n "${RELVER:-}" ]; then vargs+=(-DAPEGET_VERSION="$RELVER"); fi
          for a in x86_64 aarch64; do
            cmake -S . -B "build/$a" \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/cosmo.cmake" \
              -DCOSMO_DIR="$COSMO_DIR" -DAPEGET_ARCH="$a" "${vargs[@]}"
            cmake --build "build/$a" -j"$(nproc)"
          done

      - name: Package + gates
        run: bash bin/package.sh build/x86_64 build/aarch64 dist

      # A tag whose built binary reports a different version must not
      # publish: the about line is the compiled self identity (and the
      # self manifest's version), the filenames came from the same tag.
      - name: Assert packaged version matches the tag
        if: startsWith(github.ref_name, 'v')
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          for f in dist/ape-get.com dist/ape-get-x86_64.com dist/ape-get-aarch64.com; do
            out=$(APEGET_NO_SELF=1 "$f" about)
            grep -qF "~ Ver. $ver ~" <<<"$out" || {
              echo "FATAL: $f does not report version $ver" >&2
              grep -o "Ver\. [^ ]*" <<<"$out" >&2 || echo "  (no version line)" >&2
              exit 1; }
            echo "version ok: $f reports $ver"
          done

      - name: Upload APE artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ape-get-ape
          path: |
            dist/ape-get*.com
            dist/ape-get*.com.xz
          if-no-files-found: error
          compression-level: 0

  # Every gate above drives a Linux ELF, so none of them has ever run on the
  # system people actually install ape-get on. Both Windows defects this job
  # exists for - the default install directory the command then refused as
  # relative, and a setup that could not name its own file and so installed
  # nothing - passed every check in the repo, because the scenario suite and
  # ctest only ever ask a Linux build. Here the artefact a person would
  # download is run on the system it ships for, and the last step is the one
  # no host can stand in for: a real HKCU\Environment\Path, written by the two
  # calls that only exist on a Windows kernel, on a machine whose registry
  # nobody will ever look at again.
  windows_smoke:
    name: Windows smoke
    needs: [package]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: ape-get-ape
          path: dist

      # --yes answers the questions setup only asks a terminal, and --prefix
      # keeps the run out of the AppData the runner image happens to hold. The
      # byte comparison is the point of the job: what setup installs has to be
      # the file that ran it, worked out by itself, and a file of the right
      # length would satisfy a size check - which is exactly the check that let
      # the real failure through.
      - name: setup installs the file it is running as
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $target = Join-Path $env:RUNNER_TEMP 'apg-setup'
          $out = (& dist\ape-get.com setup --prefix $target --yes --no-path 2>&1) -join "`n"
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "setup exited $code" }
          $installed = Join-Path $target 'ape-get.com'
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash dist\ape-get.com).Hash) {
            throw 'the installed file is not the one that ran setup'
          }
          $out2 = (& $installed about 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "'about' exited $LASTEXITCODE" }
          if ($out2 -notmatch 'ape-get') { throw "'about' said nothing about ape-get" }

      # The second run is the PATH step, which the first run was told to skip.
      # This is the only check in the repository that puts a value into a real
      # registry: every other one reaches it through a stand-in, because no
      # Linux host has an HKCU\Environment to write, and the two calls that
      # touch it cannot even be reached from a Linux build. Reading the value
      # back with reg.exe is deliberate - a different program from the one that
      # wrote it, so the assertion is that Windows itself sees the entry rather
      # than that ape-get agrees with itself. The type is asserted because a
      # REG_SZ would leave a %USERPROFILE% entry already in the Path standing
      # for its own percent signs. And the third run is the read side: setup
      # has to find its own entry in a value this process did not write, and
      # say so instead of putting the directory in a second time.
      - name: setup registers the directory in the user Path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $target = Join-Path $env:RUNNER_TEMP 'apg-setup'
          $out = (& dist\ape-get.com setup --prefix $target --yes 2>&1) -join "`n"
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { throw "setup with PATH exited $code" }
          if ($out -notmatch 'Added .* to PATH') { throw "PATH was not claimed: no Added line" }
          $stored = (reg query HKCU\Environment /v Path) -join "`n"
          if ($stored -notlike "*$target*") { throw "$target is not in the stored Path:`n$stored" }
          if ($stored -notmatch 'REG_EXPAND_SZ') {
            throw "the stored Path is no longer REG_EXPAND_SZ:`n$stored"
          }
          $again = (& dist\ape-get.com setup --prefix $target --yes 2>&1) -join "`n"
          $again
          if ($LASTEXITCODE -ne 0) {
            throw "re-run over a registered directory exited $LASTEXITCODE"
          }
          if ($again -notmatch 'already registered') {
            throw "the re-run did not find the entry:`n$again"
          }
          if ($again -match 'Added .* to PATH') {
            throw "the re-run added the directory a second time"
          }

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, package, windows_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: ape-get-ape
          path: dist

      - name: Name artefacts
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          cd dist
          for f in ape-get.com ape-get-x86_64.com ape-get-aarch64.com \
                   ape-get.com.xz ape-get-x86_64.com.xz ape-get-aarch64.com.xz; do
            [ -f "$f" ] || continue          # twins exist only when they win
            case $f in
              ape-get.com*)  mv "$f" "ape-get-${ver}-fat${f#ape-get}" ;;
              *)             mv "$f" "ape-get-${ver}-${f#ape-get-}" ;;
            esac
          done
          ls -l

      # Deltas against the last K=3 stable releases (fewest bytes always:
      # a delta ships only when it is < 95% of the twin it replaces).
      # -S none: the shipped decoder carries no secondary compressors,
      # and the encoder never reaches an artefact.
      - name: Deltas against recent stables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3
          api=https://api.github.com/repos/${{ github.repository }}
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
               "$api/releases?per_page=30" > releases.json
          mapfile -t olds < <(jq -r --arg v "$ver" \
            '[.[] | select((.prerelease | not) and (.draft | not))
                  | .tag_name | sub("^v"; "") | select(. != $v)]
             | .[0:3][]' releases.json)
          echo "deltas against: ${olds[*]:-none}"
          for kind in fat x86_64 aarch64; do
            new="dist/ape-get-${ver}-${kind}.com"
            [ -f "$new" ] || continue
            cmp="$new"
            if [ -f "$new.xz" ]; then cmp="$new.xz"; fi
            gate=$(( $(stat -c %s "$cmp") * 95 / 100 ))
            for ov in "${olds[@]}"; do
              url=$(jq -r --arg n "ape-get-${ov}-${kind}.com" \
                '[.[] | .assets[]? | select(.name == $n)
                       | .browser_download_url][0] // empty' releases.json)
              [ -n "$url" ] || continue
              curl -fsSL -o old.com "$url" || continue
              out="dist/ape-get-${ver}-${kind}.com-from-${ov}.xdelta.xz"
              xdelta3 -f -e -S none -s old.com "$new" patch.xd
              xz --lzma2=preset=9e,dict=8MiB --check=sha256 -c patch.xd > "$out"
              rm -f patch.xd
              enc=$(stat -c %s "$out")
              if [ "$enc" -lt "$gate" ]; then
                echo "\`$(basename "$out")\`: $enc bytes (vs $cmp $(stat -c %s "$cmp"))" \
                  >> "$GITHUB_STEP_SUMMARY"
              else
                rm -f "$out"
                echo "delta skipped (no win): $(basename "$out") $enc/$gate"
              fi
            done
          done
          ls -l dist

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ape-get-* > SHA256SUMS.txt
          ls -l

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ape-get-*.com
            dist/ape-get-*.com.xz
            dist/ape-get-*.xdelta.xz
            dist/SHA256SUMS.txt
          # tags with a suffix (2.0.0-rc) publish as prereleases, so
          # /releases/latest keeps pointing at stable
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
